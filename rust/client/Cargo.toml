[package]
name = "opencode-client"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Tiny Rust client for the Rust OpenCode server surface"

[dependencies]
# preserve_order keeps pretty-printed responses in server key order.
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }
