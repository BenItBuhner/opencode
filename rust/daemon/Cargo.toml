[package]
name = "opengoal-daemon"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Persistent background server discovery for OpenGoal Rust clients"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
rand = "0.8"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
